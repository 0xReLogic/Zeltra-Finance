[package]
name = "engine-wasm"
version = "0.1.0"
edition = "2021"
authors = ["Zeltra Finance Engineers"]
description = "High-precision financial calculation engine in Rust compiled to WebAssembly"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
rust_decimal = { version = "1.36", features = ["serde-str", "maths"] }
rust_decimal_macros = "1.36"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
